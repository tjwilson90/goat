[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
env_logger = "0.11"
futures-util = "0.3"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
sha2 = { version = "0.10", features = ["asm"] }
smallvec = { version = "1.14", features = ["serde", "union"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "sync"] }
tokio-stream = "0.1"
warp = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 1
